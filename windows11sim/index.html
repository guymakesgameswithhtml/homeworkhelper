<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 11 Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Desktop Background -->
    <div class="desktop-background"></div>

    <!-- Desktop Icons -->
    <div class="desktop-icons">
        <div class="desktop-icon" data-app="file-explorer">
            <div class="icon-image">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 20 L45 20 L50 30 L85 30 L85 80 Q85 85 80 85 L20 85 Q15 85 15 80 Z" fill="#0078d4"/>
                </svg>
            </div>
            <div class="icon-label">File Explorer</div>
        </div>

        <div class="desktop-icon" data-app="calculator">
            <div class="icon-image">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="15" y="15" width="70" height="70" rx="5" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>
                    <circle cx="30" cy="30" r="3" fill="#666"/>
                    <circle cx="55" cy="30" r="3" fill="#666"/>
                    <circle cx="80" cy="30" r="3" fill="#666"/>
                    <rect x="20" y="45" width="15" height="10" fill="#0078d4"/>
                    <text x="50" y="55" font-size="20" fill="#666">+</text>
                </svg>
            </div>
            <div class="icon-label">Calculator</div>
        </div>

        <div class="desktop-icon" data-app="notepad">
            <div class="icon-image">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="20" y="15" width="60" height="70" rx="3" fill="#fff" stroke="#ccc" stroke-width="2"/>
                    <line x1="25" y1="30" x2="75" y2="30" stroke="#ccc" stroke-width="1"/>
                    <line x1="25" y1="40" x2="75" y2="40" stroke="#ccc" stroke-width="1"/>
                    <line x1="25" y1="50" x2="75" y2="50" stroke="#ccc" stroke-width="1"/>
                    <line x1="25" y1="60" x2="75" y2="60" stroke="#ccc" stroke-width="1"/>
                </svg>
            </div>
            <div class="icon-label">Notepad</div>
        </div>

        <div class="desktop-icon" data-app="settings">
            <div class="icon-image">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="15" fill="none" stroke="#0078d4" stroke-width="3"/>
                    <circle cx="50" cy="50" r="8" fill="#0078d4"/>
                    <rect x="48" y="20" width="4" height="12" fill="#0078d4"/>
                    <rect x="48" y="68" width="4" height="12" fill="#0078d4"/>
                    <rect x="20" y="48" width="12" height="4" fill="#0078d4"/>
                    <rect x="68" y="48" width="12" height="4" fill="#0078d4"/>
                </svg>
            </div>
            <div class="icon-label">Settings</div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-left">
            <button class="start-button" id="startBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
                    <rect x="3" y="3" width="8" height="8" fill="currentColor"/>
                    <rect x="13" y="3" width="8" height="8" fill="currentColor"/>
                    <rect x="3" y="13" width="8" height="8" fill="currentColor"/>
                    <rect x="13" y="13" width="8" height="8" fill="currentColor"/>
                </svg>
            </button>

            <div class="taskbar-search">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                    <circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
                    <line x1="14" y1="14" x2="20" y2="20" stroke="currentColor" stroke-width="2"/>
                </svg>
                <input type="text" placeholder="Ask Cortana anything" class="search-input">
            </div>

            <div class="taskbar-apps">
                <button class="taskbar-icon" data-app="file-explorer" title="File Explorer">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 3 L12 3 L13 5 L21 5 L21 19 Q21 21 19 21 L5 21 Q3 21 3 19 Z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="taskbar-icon" data-app="calculator" title="Calculator">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="3" width="18" height="18" rx="2" fill="currentColor"/>
                    </svg>
                </button>
                <button class="taskbar-icon" data-app="notepad" title="Notepad">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <rect x="4" y="2" width="16" height="20" rx="1" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="taskbar-system">
            <div class="system-tray">
                <button class="tray-icon" id="wifiBtn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 18 Q10 18 10 20 Q10 22 12 22 Q14 22 14 20 Q14 18 12 18" fill="currentColor"/>
                        <path d="M12 13 Q8 13 5 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M12 8 Q5 8 2 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="tray-icon" id="volumeBtn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 9 L7 9 L12 4 L12 20 L7 15 L3 15 Z" fill="currentColor"/>
                        <path d="M15 8 Q17 10 17 12 Q17 14 15 16" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
                <button class="tray-icon" id="batteryBtn">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
                        <rect x="20" y="6" width="2" height="8" fill="currentColor"/>
                        <rect x="4" y="6" width="12" height="8" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div class="clock" id="clock">12:30 PM</div>
        </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="startMenu">
        <div class="start-menu-header">
            <div class="user-profile">
                <div class="user-avatar">👤</div>
                <div class="user-info">
                    <div class="user-name">User</div>
                    <div class="user-status">Online</div>
                </div>
            </div>
            <button class="close-start-menu">&times;</button>
        </div>

        <div class="start-menu-search">
            <input type="text" placeholder="Type here to search" class="menu-search-input">
        </div>

        <div class="start-menu-pinned">
            <div class="menu-section-title">Pinned</div>
            <div class="menu-grid">
                <div class="menu-item" data-app="file-explorer">
                    <div class="menu-icon">📁</div>
                    <div class="menu-name">File Explorer</div>
                </div>
                <div class="menu-item" data-app="settings">
                    <div class="menu-icon">⚙️</div>
                    <div class="menu-name">Settings</div>
                </div>
                <div class="menu-item" data-app="calculator">
                    <div class="menu-icon">🧮</div>
                    <div class="menu-name">Calculator</div>
                </div>
                <div class="menu-item" data-app="notepad">
                    <div class="menu-icon">📝</div>
                    <div class="menu-name">Notepad</div>
                </div>
            </div>
        </div>

        <div class="start-menu-recommended">
            <div class="menu-section-title">Recommended</div>
            <div class="recommended-list">
                <div class="recommended-item">
                    <div class="recommended-icon">🎮</div>
                    <div class="recommended-details">
                        <div class="recommended-name">Games</div>
                    </div>
                </div>
                <div class="recommended-item">
                    <div class="recommended-icon">📸</div>
                    <div class="recommended-details">
                        <div class="recommended-name">Photos</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="start-menu-footer">
            <button class="footer-btn" id="powerBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                    <path d="M12 2 L12 12 M18.5 7.5 Q21 10 21 14 Q21 18 17 21 Q13 24 12 24 Q11 24 7 21 Q3 18 3 14 Q3 10 5.5 7.5" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                Power
            </button>
            <button class="footer-btn" id="settingsBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                    <circle cx="12" cy="12" r="3" fill="currentColor"/>
                    <circle cx="12" cy="4" r="1.5" fill="currentColor"/>
                    <circle cx="12" cy="20" r="1.5" fill="currentColor"/>
                    <circle cx="4" cy="12" r="1.5" fill="currentColor"/>
                    <circle cx="20" cy="12" r="1.5" fill="currentColor"/>
                </svg>
                Settings
            </button>
        </div>
    </div>

    <!-- Windows Container -->
    <div class="windows-container" id="windowsContainer"></div>

    <!-- Context Menu -->
    <div class="context-menu" id="contextMenu">
        <div class="context-item" data-action="refresh">Refresh</div>
        <div class="context-item" data-action="paste">Paste</div>
        <hr>
        <div class="context-item" data-action="settings">Display Settings</div>
        <div class="context-item" data-action="about">About</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
